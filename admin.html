<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Rider — Moderação</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="styles.css">
<style>
  /* O painel é de mesa, não de celular: cabe mais largura que o app. */
  #app{max-width:860px;padding-bottom:32px}
  .adm-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .adm-tabs .tab{flex:0 1 auto;padding:10px 16px}
  .row-2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .adm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .adm-actions .btn{width:auto;min-height:40px;padding:9px 14px;font-size:12.5px}
  .flag{font-size:10px;font-weight:900;letter-spacing:.6px;padding:4px 9px;border-radius:999px;
        background:rgba(255,255,255,.05);border:1px solid var(--line);color:#b9c8be}
  .empty{text-align:center;color:var(--muted);padding:26px;font-size:13.5px}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div><h1>MODERAÇÃO</h1><small>RADAR RIDER</small></div>
    </div>
    <a class="ghost-pill" href="index.html" style="text-decoration:none">← Voltar ao app</a>
  </header>

  <div class="pad">
    <div id="status" class="privacy-box"><span>🔒</span><p>Verificando acesso…</p></div>

    <div id="panel" class="hidden">
      <div class="adm-tabs">
        <div class="tab on" data-adm="reports">Denúncias</div>
        <div class="tab" data-adm="alerts">Alertas ativos</div>
        <div class="tab" data-adm="users">Usuários</div>
      </div>

      <section id="adm-reports"></section>

      <section id="adm-alerts" class="hidden">
        <div class="tabs" style="margin-bottom:14px">
          <div class="tab on" data-country="IE">🇮🇪 Irlanda</div>
          <div class="tab" data-country="GB">🇬🇧 Reino Unido</div>
        </div>
        <div id="alertsBox"></div>
      </section>

      <section id="adm-users" class="hidden"></section>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
'use strict';
const cfg = window.RADAR_CONFIG || {};
const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
const qsa = s => [...document.querySelectorAll(s)];
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let me = null, country = 'IE', alertsChannel = null;

let toastTimer = null;
function toast(text, type = 'ok') {
  const t = $('toast');
  t.textContent = text;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

function when(iso) {
  return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

const CAT = {
  roubo: '🚨 Roubo ou tentativa', grupo_hostil: '👥 Grupo hostil',
  intimidacao: '⚠️ Intimidação ou assédio', acidente: '⛔ Acidente ou bloqueio',
  via_perigosa: '🛣️ Via perigosa', outro: '📍 Outro risco'
};
const MOTIVO = {
  identificacao: 'Identifica uma pessoa', falso: 'Informação falsa',
  odio: 'Ódio, ameaça ou assédio', privacidade: 'Violação de privacidade', outro: 'Outro'
};

/* ---------- acesso ---------- */

async function boot() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    return $('status').innerHTML = '<span>🔒</span><p>Entre com a sua conta de moderação pelo app e volte a esta página.</p>';
  }
  // A checagem aqui é só para não mostrar uma tela vazia e confusa.
  // Quem realmente barra é a RLS no banco, via is_staff().
  const { data: p } = await db.from('profiles').select('role,display_name').eq('id', user.id).single();
  if (!['admin', 'moderator'].includes(p?.role)) {
    return $('status').innerHTML = '<span>🔒</span><p>Sua conta não tem permissão de moderação.</p>';
  }
  me = { id: user.id, role: p.role, name: p.display_name };

  $('status').classList.add('hidden');
  $('panel').classList.remove('hidden');
  bindTabs();
  loadReports();
  loadAlerts();
  loadUsers();

  // Moderação em tempo real: alerta novo aparece sem recarregar a página.
  alertsChannel = db.channel('adm-alerts')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'alerts' }, loadAlerts)
    .subscribe();
}

function bindTabs() {
  qsa('[data-adm]').forEach(t => t.onclick = () => {
    qsa('[data-adm]').forEach(x => x.classList.toggle('on', x === t));
    ['reports', 'alerts', 'users'].forEach(s =>
      $('adm-' + s).classList.toggle('hidden', s !== t.dataset.adm));
  });
  qsa('[data-country]').forEach(t => t.onclick = () => {
    qsa('[data-country]').forEach(x => x.classList.toggle('on', x === t));
    country = t.dataset.country;
    loadAlerts();
  });
}

/* ---------- denúncias ---------- */

async function loadReports() {
  const { data, error } = await db.from('alert_reports')
    .select('id,reason,details,status,created_at,alert_id,alerts(category,description,status,country_code)')
    .order('created_at', { ascending: false });

  const root = $('adm-reports');
  if (error) return root.innerHTML = '<p class="error">' + esc(error.message) + '</p>';

  const abertas = (data || []).filter(r => r.status === 'open');
  const resto = (data || []).filter(r => r.status !== 'open');
  if (!data?.length) return root.innerHTML = '<div class="card"><p class="empty">Nenhuma denúncia até agora.</p></div>';

  root.innerHTML =
    (abertas.length ? '<span class="mini-label">Em aberto (' + abertas.length + ')</span>' : '') +
    abertas.map(cardDenuncia).join('') +
    (resto.length ? '<span class="mini-label" style="display:block;margin-top:18px">Já tratadas</span>' : '') +
    resto.map(cardDenuncia).join('');

  qsa('[data-hide]').forEach(b => b.onclick = () => moderar(b.dataset.hide, b.dataset.alert, 'hidden'));
  qsa('[data-resolve]').forEach(b => b.onclick = () => resolverDenuncia(b.dataset.resolve, 'resolved'));
  qsa('[data-dismiss]').forEach(b => b.onclick = () => resolverDenuncia(b.dataset.dismiss, 'dismissed'));
}

function cardDenuncia(r) {
  const aberta = r.status === 'open';
  return `<div class="card">
    <div class="row-2">
      <h4>${esc(MOTIVO[r.reason] || r.reason)}</h4>
      <span class="flag">${aberta ? 'EM ABERTO' : esc(r.status).toUpperCase()}</span>
    </div>
    <p class="muted" style="margin-top:8px;font-size:13px">${esc(r.details || 'Sem detalhes.')}</p>
    <div class="card" style="margin:12px 0 0;background:rgba(255,255,255,.03)">
      <p style="font-size:12.5px"><b>${esc(CAT[r.alerts?.category] || '—')}</b></p>
      <p class="muted" style="font-size:12.5px;margin-top:4px">${esc(r.alerts?.description || 'Alerta removido.')}</p>
      <div class="meta"><span>${when(r.created_at)}</span><span>alerta: ${esc(r.alerts?.status || '—')}</span></div>
    </div>
    ${aberta ? `<div class="adm-actions">
      <button class="btn danger" data-hide="${r.id}" data-alert="${r.alert_id}">Ocultar o alerta</button>
      <button class="btn ghost" data-resolve="${r.id}">Marcar resolvida</button>
      <button class="btn ghost" data-dismiss="${r.id}">Descartar denúncia</button>
    </div>` : ''}
  </div>`;
}

async function moderar(reportId, alertId, novoStatus) {
  const { error } = await db.from('alerts').update({ status: novoStatus }).eq('id', alertId);
  if (error) return toast(error.message, 'err');
  await db.from('alert_reports').update({ status: 'resolved' }).eq('id', reportId);
  await db.from('moderation_actions').insert({ alert_id: alertId, moderator_id: me.id, action: 'alert_' + novoStatus });
  toast('Alerta ocultado e denúncia resolvida.');
  loadReports(); loadAlerts();
}

async function resolverDenuncia(id, status) {
  const { error } = await db.from('alert_reports').update({ status }).eq('id', id);
  if (error) return toast(error.message, 'err');
  toast(status === 'resolved' ? 'Denúncia marcada como resolvida.' : 'Denúncia descartada.');
  loadReports();
}

/* ---------- alertas ativos ---------- */

async function loadAlerts() {
  const { data, error } = await db.from('alerts')
    .select('id,category,description,status,created_at,expires_at,confirmations_count,country_code,is_ongoing')
    .eq('status', 'active')
    .eq('country_code', country)
    .order('created_at', { ascending: false })
    .limit(200);

  const root = $('alertsBox');
  if (error) return root.innerHTML = '<p class="error">' + esc(error.message) + '</p>';
  if (!data?.length) return root.innerHTML = '<div class="card"><p class="empty">Nenhum alerta ativo em ' + (country === 'IE' ? 'Irlanda' : 'Reino Unido') + '.</p></div>';

  root.innerHTML = data.map(a => `<div class="card">
    <div class="row-2">
      <h4>${esc(CAT[a.category] || a.category)}</h4>
      <span class="flag">${a.confirmations_count || 0} confirmações</span>
    </div>
    <p class="muted" style="margin-top:8px;font-size:13px">${esc(a.description)}</p>
    <div class="meta">
      <span>publicado ${when(a.created_at)}</span>
      <span>expira ${when(a.expires_at)}</span>
      ${a.is_ongoing ? '<span class="badge alta">AO VIVO</span>' : ''}
    </div>
    <div class="adm-actions">
      <button class="btn ghost" data-hide-alert="${a.id}">Ocultar</button>
      <button class="btn danger" data-del="${a.id}">Apagar de vez</button>
    </div>
  </div>`).join('');

  // Ocultar é o caminho normal: some do app, fica no banco e no histórico de
  // moderação. Apagar é irreversível e some com as confirmações junto.
  qsa('[data-hide-alert]').forEach(b => b.onclick = async () => {
    const { error } = await db.from('alerts').update({ status: 'hidden' }).eq('id', b.dataset.hideAlert);
    if (error) return toast(error.message, 'err');
    await db.from('moderation_actions').insert({ alert_id: b.dataset.hideAlert, moderator_id: me.id, action: 'alert_hidden' });
    toast('Alerta ocultado.');
    loadAlerts();
  });

  qsa('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Apagar este alerta para sempre? Ocultar já tira ele do app e mantém o registro.')) return;
    // O registro de moderação entra ANTES: a chave estrangeira do alerta é
    // "on delete set null", então apagar depois deixaria a ação sem o alerta.
    await db.from('moderation_actions').insert({ alert_id: b.dataset.del, moderator_id: me.id, action: 'alert_deleted' });
    const { error } = await db.from('alerts').delete().eq('id', b.dataset.del);
    if (error) return toast(error.message, 'err');
    toast('Alerta apagado.');
    loadAlerts();
  });
}

/* ---------- usuários ---------- */

async function loadUsers() {
  const { data, error } = await db.rpc('staff_user_list');
  const root = $('adm-users');
  if (error) return root.innerHTML = '<p class="error">' + esc(error.message) + '</p>';
  if (!data?.length) return root.innerHTML = '<div class="card"><p class="empty">Nenhum usuário cadastrado.</p></div>';

  root.innerHTML = `<span class="mini-label">${data.length} conta${data.length > 1 ? 's' : ''} cadastrada${data.length > 1 ? 's' : ''}</span>` +
    data.map(u => `<div class="card">
      <div class="row-2">
        <h4>${esc(u.display_name)}</h4>
        <span class="flag">${esc(u.role).toUpperCase()}</span>
      </div>
      <div class="meta">
        <span>${u.alerts_count} alerta${u.alerts_count == 1 ? '' : 's'}</span>
        <span>${u.reputation_score} pontos</span>
        <span>desde ${when(u.created_at)}</span>
      </div>
    </div>`).join('');
  // O e-mail não vem de propósito: moderar não exige saber quem é a pessoa.
}

boot();
</script>
</body>
</html>
